kind = "web"
previewPath = "/"
title = "Arabic Puzzle Generator"
version = "1.0.0"
id = "artifacts/puzzle-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19944

[services.development]
run = "pnpm --filter @workspace/puzzle-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/puzzle-generator", "run", "build" ]
publicDir = "artifacts/puzzle-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19944"
BASE_PATH = "/"
